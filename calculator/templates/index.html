<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="app">
        <section class="calculator" aria-label="Calculator">
            <header class="topbar">
                <h1>Calculator</h1>
                <div class="topbar-actions">
                    <button id="angle-toggle" class="pill" type="button" title="Toggle degrees/radians">DEG</button>
                    <button id="theme-toggle" class="pill" type="button" title="Toggle theme">Theme</button>
                </div>
            </header>

            <div class="display">
                <div id="expression" class="expression"></div>
                <div id="result" class="result">0</div>
            </div>

            <div class="memory-row">
                <button class="btn memory" data-action="mc" type="button">MC</button>
                <button class="btn memory" data-action="mr" type="button">MR</button>
                <button class="btn memory" data-action="m-plus" type="button">M+</button>
                <button class="btn memory" data-action="m-minus" type="button">M−</button>
                <span id="memory-indicator" class="memory-indicator"></span>
            </div>

            <div class="sci-grid">
                <button class="btn sci" data-value="sin(" type="button">sin</button>
                <button class="btn sci" data-value="cos(" type="button">cos</button>
                <button class="btn sci" data-value="tan(" type="button">tan</button>
                <button class="btn sci" data-value="log(" type="button">log</button>
                <button class="btn sci" data-value="ln(" type="button">ln</button>

                <button class="btn sci" data-value="√(" type="button">√</button>
                <button class="btn sci" data-value="π" type="button">π</button>
                <button class="btn sci" data-value="e" type="button">e</button>
                <button class="btn sci" data-value="(" type="button">(</button>
                <button class="btn sci" data-value=")" type="button">)</button>

                <button class="btn sci" data-value="^2" type="button">x²</button>
                <button class="btn sci" data-value="^" type="button">xʸ</button>
                <button class="btn sci" data-value="fact(" type="button">n!</button>
                <button class="btn sci" data-value="1/(" type="button">1/x</button>
                <button class="btn sci" data-value="abs(" type="button">|x|</button>
            </div>

            <div class="main-grid">
                <button class="btn danger" data-action="clear" type="button">AC</button>
                <button class="btn func" data-action="backspace" type="button">⌫</button>
                <button class="btn func" data-value="/100" type="button">%</button>
                <button class="btn operator" data-value="÷" type="button">÷</button>

                <button class="btn" data-value="7" type="button">7</button>
                <button class="btn" data-value="8" type="button">8</button>
                <button class="btn" data-value="9" type="button">9</button>
                <button class="btn operator" data-value="×" type="button">×</button>

                <button class="btn" data-value="4" type="button">4</button>
                <button class="btn" data-value="5" type="button">5</button>
                <button class="btn" data-value="6" type="button">6</button>
                <button class="btn operator" data-value="−" type="button">−</button>

                <button class="btn" data-value="1" type="button">1</button>
                <button class="btn" data-value="2" type="button">2</button>
                <button class="btn" data-value="3" type="button">3</button>
                <button class="btn operator" data-value="+" type="button">+</button>

                <button class="btn func" data-action="negate" type="button">±</button>
                <button class="btn" data-value="0" type="button">0</button>
                <button class="btn" data-value="." type="button">.</button>
                <button class="btn equals" data-action="equals" type="button">=</button>
            </div>
        </section>

        <aside class="history" aria-label="History">
            <div class="history-header">
                <h2>History</h2>
                <button id="clear-history" class="pill" type="button">Clear</button>
            </div>
            <ul id="history-list" class="history-list"></ul>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
